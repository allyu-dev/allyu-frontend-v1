name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests and build (Node 20)
    runs-on: ubuntu-latest
    container: node:20-bookworm-slim
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: npm run verify
      - name: Upload configured static site
        if: >-
          github.event_name != 'pull_request' &&
          vars.VITE_API_BASE_URL != '' &&
          vars.VITE_FIREBASE_API_KEY != '' &&
          vars.VITE_FIREBASE_AUTH_DOMAIN != '' &&
          vars.VITE_FIREBASE_PROJECT_ID != '' &&
          vars.VITE_FIREBASE_APP_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke-test image with public fixtures
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: allyu-frontend:ci
          build-args: |
            VITE_API_BASE_URL=https://backend.example.invalid
            VITE_FIREBASE_API_KEY=public-ci-fixture
            VITE_FIREBASE_AUTH_DOMAIN=ci-fixture.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID=ci-fixture
            VITE_FIREBASE_APP_ID=ci-fixture
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check Nginx configuration
        run: docker run --rm --entrypoint nginx allyu-frontend:ci -t